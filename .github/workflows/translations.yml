
name: Validate Translations

on:
  push:
    paths:
      - "*.json"
      - "parse.py"
      - ".github/workflows/translations.yml"
  pull_request:
    paths:
      - "*.json"
      - "parse.py"
      - ".github/workflows/translations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Translation Keys
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate translations
        run: python parse.py
